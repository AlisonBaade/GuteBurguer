services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gute_db
      POSTGRES_USER: gute_user
      POSTGRES_PASSWORD: gute_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gute_user -d gute_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@gute.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "8080:80"
    depends_on:
      - db

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      DEBUG: "True"
      SECRET_KEY: django-insecure-local-development-key
      VISITOR_HASH_KEY: local-development-hash-key
      DB_HOST: db
      DB_PORT: 5432
      POSTGRES_DB: gute_db
      POSTGRES_USER: gute_user
      POSTGRES_PASSWORD: gute_password
      ALLOWED_HOSTS: localhost,127.0.0.1
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      VITE_API_URL: http://localhost:8000
      VITE_WHATSAPP_NUMBER: "5500000000000"
      VITE_WHATSAPP_DISPLAY: "(00) 00000-0000"
    depends_on:
      - backend

volumes:
  postgres_data:
